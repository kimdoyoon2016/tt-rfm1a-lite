name: P1 accelerator verification

on:
  push:
    branches: [p1-accelerator-rev06]
    paths:
      - "p1_accelerator/**"
      - ".github/workflows/p1-accelerator.yml"
  workflow_dispatch:

jobs:
  behavioral-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile and run dual-K engine
        run: |
          iverilog -g2012 -Wall -s tb_p1_matmul4x4_dualk -o /tmp/p1_dualk.vvp \
            p1_accelerator/rtl/p1_matmul4x4_dualk.sv \
            p1_accelerator/tb/tb_p1_matmul4x4_dualk.sv
          vvp /tmp/p1_dualk.vvp
      - name: Compile and run FlexMAC
        run: |
          iverilog -g2012 -Wall -s tb_p1_flex_mac -o /tmp/p1_flex_mac.vvp \
            p1_accelerator/rtl/p1_flex_mac.sv \
            p1_accelerator/tb/tb_p1_flex_mac.sv
          vvp /tmp/p1_flex_mac.vvp
      - name: Compile and run FlexMAC array
        run: |
          iverilog -g2012 -Wall -s tb_p1_flex_mac_array -o /tmp/p1_flex_array.vvp \
            p1_accelerator/rtl/p1_flex_mac.sv \
            p1_accelerator/rtl/p1_flex_mac_array.sv \
            p1_accelerator/tb/tb_p1_flex_mac_array.sv
          vvp /tmp/p1_flex_array.vvp

  verilator-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Lint dual-K engine
        run: |
          verilator --lint-only --timing -Wall -Wno-fatal \
            --top-module tb_p1_matmul4x4_dualk \
            p1_accelerator/rtl/p1_matmul4x4_dualk.sv \
            p1_accelerator/tb/tb_p1_matmul4x4_dualk.sv
      - name: Lint FlexMAC
        run: |
          verilator --lint-only --timing -Wall -Wno-fatal \
            --top-module tb_p1_flex_mac \
            p1_accelerator/rtl/p1_flex_mac.sv \
            p1_accelerator/tb/tb_p1_flex_mac.sv
      - name: Elaborate default 160-cell array
        run: |
          verilator --lint-only -Wall -Wno-fatal \
            --top-module p1_flex_mac_array \
            p1_accelerator/rtl/p1_flex_mac.sv \
            p1_accelerator/rtl/p1_flex_mac_array.sv
      - name: Lint array self-test
        run: |
          verilator --lint-only --timing -Wall -Wno-fatal \
            --top-module tb_p1_flex_mac_array \
            p1_accelerator/rtl/p1_flex_mac.sv \
            p1_accelerator/rtl/p1_flex_mac_array.sv \
            p1_accelerator/tb/tb_p1_flex_mac_array.sv
